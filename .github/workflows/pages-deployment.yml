name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          fi
      - name: Build (plain HTML; no framework)
        run: exit 0
      - name: Prepare public files
        run: |
          mkdir public-site
          cp index.html 404.html home.css home.js styles.css script.js analytics.js robots.txt sitemap.xml _headers public-site/
          cp -R assets posts public-site/
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fdc9c6f6bc45f4c058e432a987e066d2
          command: pages deploy public-site --project-name=jerry-in-progress --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
